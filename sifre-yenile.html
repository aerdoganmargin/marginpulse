<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarginPulse — Yeni Şifre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0F1F3D;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.box{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.logo{font-size:26px;font-weight:700;color:#0F1F3D;text-align:center;margin-bottom:0.5rem;}
.logo span{color:#2563EB;}
.tagline{font-size:12px;color:#94A3B8;text-align:center;margin-bottom:2rem;}
.field{margin-bottom:1rem;}
.field label{font-size:12px;color:#64748B;display:block;margin-bottom:6px;}
.field input{width:100%;padding:11px 14px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;}
.field input:focus{outline:none;border-color:#2563EB;}
.btn{width:100%;background:#2563EB;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:0.5rem;}
.btn:hover{background:#1d4ed8;}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.msg{font-size:13px;text-align:center;margin-top:1rem;padding:10px;border-radius:8px;display:none;}
.msg.error{background:#FEF2F2;color:#DC2626;display:block;}
.msg.success{background:#F0FDF4;color:#059669;display:block;}
.msg.info{background:#EFF6FF;color:#1d4ed8;display:block;}
.link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:#2563EB;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Margin<span>Pulse</span></div>
  <div class="tagline" data-i18n="tagline">Yeni şifreni belirle</div>

  <div id="formArea" style="display:none;">
    <div class="field">
      <label data-i18n="label_pw1">Yeni şifre</label>
      <input id="pw1" type="password" data-i18n-ph="ph_pw1" placeholder="En az 6 karakter" />
    </div>
    <div class="field">
      <label data-i18n="label_pw2">Yeni şifre (tekrar)</label>
      <input id="pw2" type="password" placeholder="••••••••" />
    </div>
    <button class="btn" id="saveBtn" onclick="savePassword()" data-i18n="btn_save">Şifreyi güncelle</button>
  </div>

  <div class="msg" id="msg"></div>
  <a href="login.html" class="link" id="loginLink" style="display:none;" data-i18n="login_link">Giriş sayfasına git</a>
</div>

<script>
const SUPABASE_URL = 'https://dmklhurvzahoiaklsnwo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRta2xodXJ2emFob2lha2xzbndvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjQxNjMsImV4cCI6MjA5NTc0MDE2M30.e-jJJ_Ru3pDKBnK_cw63pHhl_TN44LXAIC7P8w9mSns';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const I18N = {
  tr: {
    tagline:"Yeni şifreni belirle", label_pw1:"Yeni şifre", ph_pw1:"En az 6 karakter",
    label_pw2:"Yeni şifre (tekrar)", btn_save:"Şifreyi güncelle", login_link:"Giriş sayfasına git",
    checking:"Kontrol ediliyor…", can_set:"Yeni şifreni belirleyebilirsin.",
    invalid:'❌ Bu bağlantı geçersiz veya süresi dolmuş.<br>Lütfen giriş sayfasından tekrar "Şifremi unuttum" de.',
    err_pwlen:"Şifre en az 6 karakter olmalı", err_match:"Şifreler aynı değil",
    updating:"Güncelleniyor…", err_update:"Güncellenemedi: ",
    ok_update:"✅ Şifren güncellendi! Şimdi yeni şifrenle giriş yapabilirsin."
  },
  en: {
    tagline:"Set your new password", label_pw1:"New password", ph_pw1:"At least 6 characters",
    label_pw2:"New password (again)", btn_save:"Update password", login_link:"Go to login page",
    checking:"Checking…", can_set:"You can set your new password.",
    invalid:'❌ This link is invalid or expired.<br>Please go to the login page and use "Forgot password" again.',
    err_pwlen:"Password must be at least 6 characters", err_match:"Passwords don't match",
    updating:"Updating…", err_update:"Update failed: ",
    ok_update:"✅ Your password has been updated! You can now log in with your new password."
  }
};
let lang = localStorage.getItem('mp_lang');
if (!lang) { const n=(navigator.language||'tr').toLowerCase(); lang = n.startsWith('tr')?'tr':'en'; }
function t(k){ return (I18N[lang] && I18N[lang][k]) || k; }
(function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k=el.getAttribute('data-i18n'); if(I18N[lang][k]!==undefined) el.textContent=I18N[lang][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const k=el.getAttribute('data-i18n-ph'); if(I18N[lang][k]!==undefined) el.placeholder=I18N[lang][k];
  });
  document.documentElement.lang = lang;
})();

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.innerHTML = text;
  el.className = 'msg ' + type;
}

// Sayfa açıldığında: sıfırlama linkiyle mi gelindi kontrol et
(async () => {
  showMsg(t('checking'), 'info');
  await new Promise(r => setTimeout(r, 600));
  const { data } = await sb.auth.getSession();

  if (data.session) {
    document.getElementById('formArea').style.display = 'block';
    showMsg(t('can_set'), 'info');
  } else {
    showMsg(t('invalid'), 'error');
    document.getElementById('loginLink').style.display = 'block';
  }
})();

async function savePassword() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('saveBtn');

  if (pw1.length < 6) { showMsg(t('err_pwlen'), 'error'); return; }
  if (pw1 !== pw2) { showMsg(t('err_match'), 'error'); return; }

  btn.disabled = true;
  btn.textContent = t('updating');

  const { error } = await sb.auth.updateUser({ password: pw1 });

  if (error) {
    showMsg(t('err_update') + error.message, 'error');
    btn.disabled = false;
    btn.textContent = t('btn_save');
  } else {
    document.getElementById('formArea').style.display = 'none';
    showMsg(t('ok_update'), 'success');
    document.getElementById('loginLink').style.display = 'block';
    setTimeout(async () => { await sb.auth.signOut(); }, 1000);
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') savePassword(); });
</script>
</body>
</html>
